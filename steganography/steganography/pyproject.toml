[project]
name = "steganography"
version = "1.0.0"
description = "Secure LSB image steganography with AES-256-GCM authenticated encryption"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "yafet", email = "yafet.com@proton.me" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "cryptography>=41.0",
]
keywords = ["steganography", "lsb", "cryptography", "aes-gcm", "image", "security"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Multimedia :: Graphics",
    "Typing :: Typed",
]

[project.scripts]
steganography = "steganography.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pillow>=10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
